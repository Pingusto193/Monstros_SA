# Blueprint do Render: cria o banco, a API e o site de uma vez.
# No painel do Render: New → Blueprint → escolha este repositório → Apply.
#
# Atenção: o PostgreSQL gratuito do Render expira 30 dias após a criação
# (depois disso é preciso migrar para um plano pago ou os dados são apagados).

databases:
  - name: rastro-db
    plan: free
    region: virginia
    databaseName: rastro
    user: rastro
    # Acesso só pela rede interna do Render (a API). Nada exposto na internet.
    ipAllowList: []

services:
  # API (Back_end) — Express + Prisma
  - type: web
    name: rastro-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci
    # As migrações rodam na inicialização, que tem acesso à rede interna do banco.
    # O site publicado começa vazio (sem dados de exemplo).
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rastro-db
          property: connectionString
      # Endereço do site. Se o Render criar outro endereço, ajuste aqui (ou em Environment).
      - key: CORS_ORIGIN
        value: https://rastro-web-t402.onrender.com

  # Site (Front_End) — build estático do Vite
  - type: web
    name: rastro-web
    runtime: static
    rootDir: Front_End
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Endereço da API. Se o Render criar outro endereço, ajuste aqui (ou em Environment)
      # e publique de novo o site ("Clear build cache & deploy").
      - key: VITE_API_URL
        value: https://rastro-api-376w.onrender.com
    routes:
      # SPA: qualquer caminho (/perfil/victor, /explorar…) abre o index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
